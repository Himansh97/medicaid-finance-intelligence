name: PostgreSQL and Docker runtime
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: medicaid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d medicaid_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PG_TEST_DSN: postgresql://test:test-only@localhost:5432/medicaid_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q -m 'not integration'
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/dev-up.sh
      - run: python3 scripts/smoke_runtime.py
      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Shutdown
        if: always()
        run: docker compose down
